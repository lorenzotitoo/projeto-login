<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">
                
            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p id="msg">Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
                <form id="form-login" autocomplete="on">
                    <div class="campo">
                        <span class="material-icons">person</span>
                        <label for="iemail">
                            <input type="email" name="email" id="iemail" placeholder="seu e-mail" autocomplete="email" required maxlength="40">
                        </label>
                    </div>
                    <div class="campo">
                        <span class="material-icons">key</span>
                        <label for="isenha">
                            <input type="password" name="senha" id="isenha" placeholder="sua senha" autocomplete="current-password" required minlength="6">
                        </label>
                    </div>
                    <button id="join" type="submit">Entrar</button>
                    <p id="mensagem-erro" style="color: red;"></p>
                    <a class="botao" href="esqueci.html">
                        Esqueci a senha <span class="material-icons">mail</span>
                    </a>
                    <a class="botao" href="frontcadastro/cadastro.html">
                        Não possui conta? Cadastre-se 
                    </a>
                    
                </form>
            
            </div>
        </section>

        
    </main>
    <script src="script.js"></script>
</body>
</html>
