<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir</title>
    <link rel="stylesheet" href="redefinir.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">
                
            </div>
            <div id="formulario">
                <h1>Redefinir Senha</h1>
                <p id="msg">Insira sua nova senha e confirme-a abaixo.</p>
                <form id="form-login" autocomplete="on">
                    <div class="campo">
                        <span class="material-icons">key</span>
                        <label for="isenha">
                            <input type="password" name="senha" id="isenha" placeholder="sua nova senha" autocomplete="new-password" required minlength="6">
                        </label>
                    </div>
                    <div class="campo">
                        <span class="material-icons">key</span>
                        <label for="iconfirmasenha">
                            <input type="password" name="senha" id="iconfirmasenha" placeholder="confirme sua nova senha" autocomplete="new-password" required minlength="6">
                        </label>
                    </div>
                    <button id="join" type="submit">Redefinir</button>
                    <p id="mensagem-erro" style="color: red;"></p>
                    
                </form>
            
            </div>
        </section>

    </main>
    <script src="redefinir.js"></script>
</body>
</html>
